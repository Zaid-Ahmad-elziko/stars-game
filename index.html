<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<!-- 🆕 PWA: ربط ملف manifest -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f3460">

<!-- 🆕 PWA: دعم iOS (سفاري) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="النجوم">
<link rel="apple-touch-icon" href="icon-512.png">

<title>⭐ لعبة التقاط النجوم</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Arial', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    color: white;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }

  h1 {
    margin-bottom: 15px;
    font-size: 28px;
    text-shadow: 0 0 20px #ffd700;
    color: #ffd700;
  }

  #gameContainer {
    position: relative;
    width: 400px;
    max-width: 95vw;
    height: 550px;
    max-height: 75vh;
    background: linear-gradient(180deg, #0f0f23 0%, #1a1a3e 100%);
    border: 3px solid #ffd700;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
  }

  #score {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 20px;
    font-weight: bold;
    color: #ffd700;
    z-index: 10;
    text-shadow: 0 0 10px #ffd700;
    transition: transform 0.15s;
  }

  #lives {
    position: absolute;
    top: 10px;
    left: 15px;
    font-size: 20px;
    z-index: 10;
  }

  #basket {
    position: absolute;
    bottom: 10px;
    width: 70px;
    height: 50px;
    background: linear-gradient(180deg, #8B4513, #654321);
    border-radius: 0 0 35px 35px;
    border: 3px solid #d4a574;
    transition: left 0.05s linear;
    box-shadow: 0 0 20px rgba(212, 165, 116, 0.6);
  }

  #basket::before {
    content: '';
    position: absolute;
    top: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 12px;
    background: #d4a574;
    border-radius: 50%;
  }

  .star {
    position: absolute;
    font-size: 30px;
    filter: drop-shadow(0 0 10px gold);
    pointer-events: none;
  }

  #startScreen, #gameOverScreen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.85);
    z-index: 100;
    gap: 20px;
    padding: 20px;
    text-align: center;
  }

  #gameOverScreen { display: none; }

  button {
    padding: 12px 35px;
    font-size: 18px;
    font-weight: bold;
    color: #1a1a2e;
    background: linear-gradient(135deg, #ffd700, #ffb700);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
  }

  button:hover {
    transform: scale(1.1);
    box-shadow: 0 8px 25px rgba(255, 215, 0, 0.7);
  }

  #finalScore {
    font-size: 24px;
    color: #ffd700;
  }

  .controls-hint {
    margin-top: 15px;
    font-size: 14px;
    color: #aaa;
  }

  /* 🆕 زر تثبيت التطبيق */
  #installBtn {
    position: fixed;
    top: 15px;
    left: 15px;
    padding: 8px 18px;
    font-size: 14px;
    z-index: 999;
    display: none;
  }
</style>
</head>
<body>

<!-- 🆕 زر تثبيت التطبيق (يظهر تلقائياً في أندرويد/كروم) -->
<button id="installBtn">📲 تثبيت التطبيق</button>

<h1>⭐ التقاط النجوم ⭐</h1>

<div id="gameContainer">
  <div id="score">النقاط: 0</div>
  <div id="lives">❤️❤️❤️</div>
  <div id="basket"></div>

  <div id="startScreen">
    <h2>هل أنت مستعد؟</h2>
    <p>حرّك السلة بلمس الشاشة أو الأسهم ⬅️➡️</p>
    <button onclick="startGame()">ابدأ اللعبة 🚀</button>
  </div>

  <div id="gameOverScreen">
    <h2>انتهت اللعبة! 🎯</h2>
    <p id="finalScore"></p>
    <button onclick="startGame()">العب مرة أخرى 🔄</button>
  </div>
</div>

<p class="controls-hint">استخدم ← → أو المس الشاشة</p>

<script>
// ===== المتغيرات =====
const container = document.getElementById('gameContainer');
const basket = document.getElementById('basket');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const gameOverScreen = document.getElementById('gameOverScreen');
const startScreen = document.getElementById('startScreen');
const finalScore = document.getElementById('finalScore');

let basketX = 165;
let score = 0;
let lives = 3;
let stars = [];
let gameRunning = false;
let spawnInterval, gameLoop;

const BASKET_WIDTH = 70;
let CONTAINER_WIDTH = 400;
let CONTAINER_HEIGHT = 550;

// تحديث الأبعاد عند تغيير حجم الشاشة
function updateDimensions() {
  CONTAINER_WIDTH = container.clientWidth;
  CONTAINER_HEIGHT = container.clientHeight;
}
window.addEventListener('resize', updateDimensions);
updateDimensions();

// ===== تحريك السلة =====
function moveBasket(x) {
  basketX = Math.max(0, Math.min(CONTAINER_WIDTH - BASKET_WIDTH, x));
  basket.style.left = basketX + 'px';
}

document.addEventListener('keydown', (e) => {
  if (!gameRunning) return;
  if (e.key === 'ArrowLeft') moveBasket(basketX - 30);
  if (e.key === 'ArrowRight') moveBasket(basketX + 30);
});

container.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!gameRunning) return;
  const rect = container.getBoundingClientRect();
  const touchX = e.touches[0].clientX - rect.left;
  moveBasket(touchX - BASKET_WIDTH / 2);
}, { passive: false });

container.addEventListener('touchstart', (e) => {
  if (!gameRunning) return;
  const rect = container.getBoundingClientRect();
  const touchX = e.touches[0].clientX - rect.left;
  moveBasket(touchX - BASKET_WIDTH / 2);
}, { passive: true });

container.addEventListener('mousemove', (e) => {
  if (!gameRunning) return;
  const rect = container.getBoundingClientRect();
  moveBasket(e.clientX - rect.left - BASKET_WIDTH / 2);
});

// ===== إنشاء نجمة جديدة =====
function spawnStar() {
  if (!gameRunning) return;

  const star = document.createElement('div');
  star.className = 'star';
  star.textContent = '⭐';
  const x = Math.random() * (CONTAINER_WIDTH - 30);
  star.style.left = x + 'px';
  star.style.top = '-40px';
  container.appendChild(star);

  stars.push({
    el: star,
    x: x,
    y: -40,
    speed: 2 + Math.random() * 2 + (score * 0.05)
  });
}

// ===== حلقة اللعبة =====
function gameLoopFn() {
  if (!gameRunning) return;

  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    s.y += s.speed;
    s.el.style.top = s.y + 'px';

    // التصادم مع السلة
    const basketTop = CONTAINER_HEIGHT - 60;
    if (s.y + 30 >= basketTop && s.y < basketTop + 50) {
      if (s.x + 30 > basketX && s.x < basketX + BASKET_WIDTH) {
        // التقاط!
        s.el.remove();
        stars.splice(i, 1);
        score += 10;
        scoreEl.textContent = `النقاط: ${score}`;
        scoreEl.style.transform = 'scale(1.3)';
        setTimeout(() => scoreEl.style.transform = 'scale(1)', 150);
        continue;
      }
    }

    // سقطت نجمة
    if (s.y > CONTAINER_HEIGHT) {
      s.el.remove();
      stars.splice(i, 1);
      lives--;
      livesEl.textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(3 - Math.max(0, lives));

      if (lives <= 0) {
        endGame();
        return;
      }
    }
  }

  gameLoop = requestAnimationFrame(gameLoopFn);
}

// ===== بدء اللعبة =====
function startGame() {
  updateDimensions();

  // إعادة تعيين
  stars.forEach(s => s.el.remove());
  stars = [];
  score = 0;
  lives = 3;
  basketX = (CONTAINER_WIDTH - BASKET_WIDTH) / 2;

  scoreEl.textContent = 'النقاط: 0';
  livesEl.textContent = '❤️❤️❤️';
  basket.style.left = basketX + 'px';
  startScreen.style.display = 'none';
  gameOverScreen.style.display = 'none';

  gameRunning = true;

  // إنشاء النجوم بشكل متكرر
  clearInterval(spawnInterval);
  spawnInterval = setInterval(spawnStar, 800 - Math.min(400, score * 5));

  // بدء الحركة
  cancelAnimationFrame(gameLoop);
  gameLoopFn();
}

// ===== إنهاء اللعبة =====
function endGame() {
  gameRunning = false;
  clearInterval(spawnInterval);
  cancelAnimationFrame(gameLoop);
  finalScore.textContent = `نقاطك: ${score} ⭐`;
  gameOverScreen.style.display = 'flex';
}

// ============================================
// 🆕 PWA: تسجيل Service Worker
// ============================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('✅ تم تسجيل Service Worker بنجاح'))
      .catch((err) => console.log('❌ فشل التسجيل:', err));
  });
}

// ============================================
// 🆕 PWA: زر التثبيت المخصص
// ============================================
let deferredPrompt;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  console.log('نتيجة التثبيت:', outcome);
  deferredPrompt = null;
  installBtn.style.display = 'none';
});

// إخفاء الزر بعد التثبيت
window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
  console.log('🎉 تم تثبيت التطبيق!');
});
</script>

</body>
</html>
